name: witness deployed
description: >-
  After a deploy, tells the witness cards cited in the deployed commits, or on the Ships
  lines of the pull requests they came from, where they shipped,
  moves the ones that were waiting on it, as the project's rules say, and records the
  deploy on the project so the next one knows where to compare from.
author: jobbin-ab
branding:
  icon: check-circle
  color: green
inputs:
  link:
    description: >-
      A share link to the witness project (Share on the project page). An edit link lets the
      step move cards; a view link lets it comment only. Keep it in a repository secret.
    required: true
  environment:
    description: Where this deploy landed, as your team names it — staging, production, preview.
    required: true
  url:
    description: The address of that environment, if it has one. Goes in the comment so a person can open it.
    required: false
  status:
    description: >-
      A status to move cards to — only cards now in Blocked, the ones waiting on a deploy.
      Leave it out and the step only comments. A status key from the project's document, such as
      verify. Never done: a pipeline has no person to name.
    required: false
  text:
    description: >-
      Text to scan for card ids beside the commits — a release's notes, say, passed from
      github.event.release.body on a workflow that runs on a release. The same id rule
      applies to it; nothing else about it is read.
    required: false
  since:
    description: >-
      Where to compare from instead of the previous deploy the project recorded — a commit, a
      tag or any ref GitHub can compare from. Left out, the step takes the project's record;
      before there is one, the previous successful run of this workflow; and with neither,
      the text alone, or the head commit.
    required: false
  sha:
    description: >-
      The commit that shipped, when it is not the one the workflow runs on — a build promoted
      from an earlier run, a chosen ref, a rollback. Defaults to the workflow's own commit.
    required: false
  release:
    description: >-
      The name your team calls this deploy by, when it has one — a release tag, a build number:
      github.event.release.tag_name on a workflow that runs on a release. Shown on the card
      beside the commit.
    required: false
  token:
    description: >-
      The GitHub token used to read this repository's commits and the pull requests they
      came from. On a private repository the job needs pull-requests read for the second.
    required: false
    default: ${{ github.token }}
outputs:
  cards:
    description: JSON — the cards the deploy reached, each with its id, its title, the status it had and the one it has now.
runs:
  using: node24
  main: dist/main.cjs
